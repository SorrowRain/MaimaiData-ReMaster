name: MaimaiData
schemes:
  MaimaiData:
    build:
      targets:
        MaimaiData: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaimaiDataTests
options:
  bundleIdPrefix: dev.0xsr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: D5F492VR43
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  MaimaiData:
    type: application
    platform: iOS
    sources:
      - path: MaimaiData
    info:
      path: MaimaiData/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SyncServiceHost: $(SYNC_SERVICE_HOST)
        SyncServiceAccessKey: $(SYNC_SERVICE_ACCESS_KEY)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.0xsr.maimaidata.oauth
            CFBundleURLSchemes:
              - maimaidata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.0xsr.maimaidata
        PRODUCT_NAME: MaimaiData
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Re:MaiData"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 需要访问您的相册以保存曲绘封面与 Best50 成绩图
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
  MaimaiDataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaimaiDataTests
    dependencies:
      - target: MaimaiData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.0xsr.maimaidata.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MaimaiData.app/MaimaiData"
        BUNDLE_LOADER: "$(TEST_HOST)"
